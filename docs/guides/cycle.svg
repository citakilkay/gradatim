<svg xmlns="http://www.w3.org/2000/svg" width="880" height="474" viewBox="0 0 880 474" role="img" aria-labelledby="cycle-title cycle-desc">
  <title id="cycle-title">Gradatim's cycle: fourteen steps in three phases, each with its skill</title>
  <desc id="cycle-desc">Foundation, once: init (init-project), then research (research-topics), then decide (decide-direction), then concept (write-concept), then architecture (write-architecture). The delivery loop, per sprint: new sprint (new-sprint), then for each task design task (design-task), build task (build-task), close task (close-task) and draft PR (draft-pr), then close sprint (close-sprint) and the next sprint. Ship and evolve: release (ship-release) when there is something to ship, review (review-project), and demo (record-demo) for a UI change. In an existing codebase, init's quick start goes straight to design task.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .card { fill: #0d1213; stroke: #27322f; }
    .panel { fill: #111718; stroke: #27322f; }
    .box { fill: #151c1d; stroke: #3a4744; }
    .phase { font-size: 11px; font-weight: 600; letter-spacing: .09em; }
    .note { fill: #8b9b9a; font-weight: 400; letter-spacing: 0; }
    .step { fill: #dee7e6; font-size: 13px; font-weight: 600; }
    .number { fill: #8b9b9a; font-weight: 400; }
    .skill { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .label { fill: #a2b1b0; font-size: 11px; }
    .then, .when { fill: none; stroke: #8b9b9a; stroke-width: 1.5; marker-end: url(#head); }
    .when { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 .8 L7.2 4 L0 7.2 z" fill="#8b9b9a"/>
    </marker>
  </defs>
  <rect class="card" x=".5" y=".5" width="879" height="473" rx="12"/>

  <!-- The phases -->
  <rect class="panel" x="16" y="16" width="196" height="362" rx="10"/>
  <text class="phase" x="32" y="38" fill="#5cb4b8">1 · FOUNDATION<tspan class="note" dx="8">once</tspan></text>
  <rect class="panel" x="264" y="98" width="600" height="200" rx="10"/>
  <text class="phase" x="280" y="120" fill="#71bf95">2 · DELIVERY LOOP<tspan class="note" dx="8">per sprint</tspan></text>
  <rect class="panel" x="264" y="332" width="600" height="126" rx="10"/>
  <text class="phase" x="380" y="354" fill="#d8a545">3 · SHIP &amp; EVOLVE</text>

  <!-- The steps, each with its skill -->
  <rect class="box" x="32" y="52" width="164" height="46" rx="8"/>
  <text class="step" x="46" y="72"><tspan class="number">1</tspan><tspan dx="7">init</tspan></text>
  <text class="skill" x="46" y="88" fill="#5cb4b8">init-project</text>
  <rect class="box" x="32" y="118" width="164" height="46" rx="8"/>
  <text class="step" x="46" y="138"><tspan class="number">2</tspan><tspan dx="7">research</tspan></text>
  <text class="skill" x="46" y="154" fill="#5cb4b8">research-topics</text>
  <rect class="box" x="32" y="184" width="164" height="46" rx="8"/>
  <text class="step" x="46" y="204"><tspan class="number">3</tspan><tspan dx="7">decide</tspan></text>
  <text class="skill" x="46" y="220" fill="#5cb4b8">decide-direction</text>
  <rect class="box" x="32" y="250" width="164" height="46" rx="8"/>
  <text class="step" x="46" y="270"><tspan class="number">4</tspan><tspan dx="7">concept</tspan></text>
  <text class="skill" x="46" y="286" fill="#5cb4b8">write-concept</text>
  <rect class="box" x="32" y="316" width="164" height="46" rx="8"/>
  <text class="step" x="46" y="336"><tspan class="number">5</tspan><tspan dx="7">architecture</tspan></text>
  <text class="skill" x="46" y="352" fill="#5cb4b8">write-architecture</text>
  <rect class="box" x="280" y="136" width="164" height="46" rx="8"/>
  <text class="step" x="294" y="156"><tspan class="number">6</tspan><tspan dx="7">new sprint</tspan></text>
  <text class="skill" x="294" y="172" fill="#71bf95">new-sprint</text>
  <rect class="box" x="482" y="136" width="164" height="46" rx="8"/>
  <text class="step" x="496" y="156"><tspan class="number">7</tspan><tspan dx="7">design task</tspan></text>
  <text class="skill" x="496" y="172" fill="#71bf95">design-task</text>
  <rect class="box" x="684" y="136" width="164" height="46" rx="8"/>
  <text class="step" x="698" y="156"><tspan class="number">8</tspan><tspan dx="7">build task</tspan></text>
  <text class="skill" x="698" y="172" fill="#71bf95">build-task</text>
  <rect class="box" x="684" y="236" width="164" height="46" rx="8"/>
  <text class="step" x="698" y="256"><tspan class="number">9</tspan><tspan dx="7">close task</tspan></text>
  <text class="skill" x="698" y="272" fill="#71bf95">close-task</text>
  <rect class="box" x="482" y="236" width="164" height="46" rx="8"/>
  <text class="step" x="496" y="256"><tspan class="number">10</tspan><tspan dx="7">draft PR</tspan></text>
  <text class="skill" x="496" y="272" fill="#71bf95">draft-pr</text>
  <rect class="box" x="280" y="236" width="164" height="46" rx="8"/>
  <text class="step" x="294" y="256"><tspan class="number">11</tspan><tspan dx="7">close sprint</tspan></text>
  <text class="skill" x="294" y="272" fill="#71bf95">close-sprint</text>
  <rect class="box" x="280" y="370" width="164" height="46" rx="8"/>
  <text class="step" x="294" y="390"><tspan class="number">12</tspan><tspan dx="7">release</tspan></text>
  <text class="skill" x="294" y="406" fill="#d8a545">ship-release</text>
  <rect class="box" x="482" y="370" width="164" height="46" rx="8"/>
  <text class="step" x="496" y="390"><tspan class="number">13</tspan><tspan dx="7">review</tspan></text>
  <text class="skill" x="496" y="406" fill="#d8a545">review-project</text>
  <rect class="box" x="684" y="370" width="164" height="46" rx="8"/>
  <text class="step" x="698" y="390"><tspan class="number">14</tspan><tspan dx="7">demo</tspan></text>
  <text class="skill" x="698" y="406" fill="#d8a545">record-demo</text>

  <!-- The next step -->
  <path class="then" d="M114 98 L114 117"/>
  <path class="then" d="M114 164 L114 183"/>
  <path class="then" d="M114 230 L114 249"/>
  <path class="then" d="M114 296 L114 315"/>
  <path class="then" d="M196 339 L225 339 Q232 339 232 332 L232 158 Q232 151 239 151 L279 151"/>
  <path class="then" d="M444 159 L481 159"/>
  <path class="then" d="M646 159 L683 159"/>
  <path class="then" d="M766 182 L766 235"/>
  <path class="then" d="M684 259 L647 259"/>
  <path class="then" d="M482 259 L445 259"/>
  <path class="then" d="M362 282 L362 369"/>
  <path class="then" d="M444 393 L481 393"/>
  <text class="label" x="371" y="321">something to ship</text>

  <!-- A loop back, or a step that runs when it applies -->
  <path class="when" d="M196 75 L557 75 Q564 75 564 82 L564 135"/>
  <text class="label" x="380" y="66" text-anchor="middle">existing codebase: quick start</text>
  <path class="when" d="M564 236 L564 183"/>
  <text class="label" x="573" y="213">next task</text>
  <path class="when" d="M362 236 L362 183"/>
  <text class="label" x="371" y="213">next sprint</text>
  <path class="when" d="M564 282 L564 308 Q564 315 571 315 L759 315 Q766 315 766 322 L766 369"/>
  <text class="label" x="775" y="352">UI change</text>
  <path class="when" d="M564 416 L564 435 Q564 442 557 442 L253 442 Q246 442 246 435 L246 174 Q246 167 253 167 L279 167"/>
  <text class="label" x="300" y="436">next sprint</text>

  <!-- The key -->
  <path class="then" d="M32 410 L64 410"/>
  <text class="label" x="74" y="414">next step</text>
  <path class="when" d="M32 432 L64 432"/>
  <text class="label" x="74" y="436">loop, or when it applies</text>
</svg>
